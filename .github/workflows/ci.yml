name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # #1020: `check` took 30–42 min as one job, against a 45 min timeout. It is now the aggregator of
  # the jobs below, which run side by side: the static gates, the core suite in shards (merged
  # below), and the other packages. `check` is the one required check (the ruleset names it).
  #
  # Same gates as `npm run check` (locally one command), split: `check:static` + `coverage` +
  # `check:models`. The merged coverage keeps every threshold of packages/agboss/vitest.config.ts.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:static
      # the GitHub Wiki is docs too (#240): its ts blocks compile, its commands and links exist.
      # It is checked as it goes with this code (#341): a PR's own Wiki branch `docs/wiki/<head
      # branch>` when it exists, else `docs/wiki-pending` (what sync-wiki.yml publishes), else the
      # published Wiki.
      - name: Choose the Wiki to check
        id: wiki
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          has() { git ls-remote --exit-code --heads origin "$1" > /dev/null 2>&1; }
          if [ -n "$HEAD_REF" ] && has "docs/wiki/$HEAD_REF"; then
            echo "repository=${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
            echo "ref=docs/wiki/$HEAD_REF" >> "$GITHUB_OUTPUT"
          elif has docs/wiki-pending; then
            echo "repository=${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
            echo "ref=docs/wiki-pending" >> "$GITHUB_OUTPUT"
          else
            echo "repository=${GITHUB_REPOSITORY}.wiki" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: ${{ steps.wiki.outputs.repository }}
          ref: ${{ steps.wiki.outputs.ref }}
          path: wiki
      - name: Check the Wiki (${{ steps.wiki.outputs.ref || 'published' }})
        run: node scripts/check-docs.mjs --wiki wiki

  # The core suite: vitest's two projects in shards, one runner each (`faults` runs one file at a
  # time inside its shard, as its `singleFork` demands). A shard writes its results and coverage
  # into a blob; the `coverage` job merges them and holds the thresholds. 6 + 3 shards: `unit` was
  # ~13 min and `faults` ~12 min of one runner each, after each other.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: unit, shard: 1, of: 6 }
          - { project: unit, shard: 2, of: 6 }
          - { project: unit, shard: 3, of: 6 }
          - { project: unit, shard: 4, of: 6 }
          - { project: unit, shard: 5, of: 6 }
          - { project: unit, shard: 6, of: 6 }
          - { project: faults, shard: 1, of: 3 }
          - { project: faults, shard: 2, of: 3 }
          - { project: faults, shard: 3, of: 3 }
    name: tests (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.of }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the tests import the built `dist/`
      - run: npm run build
      # the example's generated types: a test lints the example's workflow modules with types
      - run: npm run types -w flow-patterns-example
      - name: Run the shard
        run: >-
          npm run coverage:shard -w @agboss/core --
          --project ${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.of }}
          --outputFile.blob=.vitest-reports/blob-${{ matrix.project }}-${{ matrix.shard }}-${{ matrix.of }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.project }}-${{ matrix.shard }}-${{ matrix.of }}
          path: packages/agboss/.vitest-reports/
          if-no-files-found: error
          retention-days: 1

  # The merged core run: every shard's blob, held against the thresholds of vitest.config.ts and
  # against test-run.json (#630: every file of every project ran at least one test).
  coverage:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: packages/agboss/.vitest-reports
          merge-multiple: true
      - name: Merge the shards and check the coverage thresholds
        run: npm run coverage:merge -w @agboss/core
      - name: Generate coverage badge JSON
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/coverage-badge.cjs packages/agboss/coverage/coverage-summary.json > coverage.json
      - name: Upload coverage badge artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage.json
          retention-days: 1

  # The other packages' suites (own thresholds, unchanged) and the example's model check.
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run coverage -w @agboss/cli -w flow-patterns-example
      - run: npm run check:models

  # The one required check. Red unless every job above passed: a skipped or cancelled job is not
  # a pass here (GitHub counts a skipped required job as one, hence `always()` and the test).
  check:
    needs: [static, tests, coverage, packages]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'length == 4 and all(.[]; .result == "success")' > /dev/null || {
            echo "check: a job did not pass" >&2
            exit 1
          }

  # #497: the packed @agboss/core / @agboss/cli in a project of their own (an external dependency,
  # never the workspace link): `workflowOf`, `testWith`, `agboss describe` / `check` pass there, and
  # without agbossVitest() `workflowOf` fails with its TestSetupError. Not in `make check` (~2 min).
  # #533 item 3, #626: mutation testing of the payment-relevant modules, one job per shard of
  # stryker.config.mjs (MUTATION_SHARD), each incremental (its last run's results cached): every
  # mutant killed or justified where it stands, else red. mutation-nightly.yml runs every shard cold.
  mutation:
    runs-on: ubuntu-24.04
    # a cold run of a shard (no cached results) takes up to about 50 min here; an incremental one a few
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          [
            fencing,
            sqlite-stores,
            keys-and-calls,
            takeover,
            recovery,
            undo,
            unwind,
            money,
            a2a-tasks,
            a2a-server,
            a2a-client,
            a2a-direct,
          ]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @agboss/core
      - name: Restore the shard's last mutation run
        uses: actions/cache@v4
        with:
          path: packages/agboss/reports/stryker-incremental-${{ matrix.shard }}.json
          key: stryker-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.shard }}-
      - name: Mutation testing of the shard (break below 100 % killed or justified)
        run: npm run test:mutation -w @agboss/core
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: packages/agboss/reports/mutation/

  # #811: the official A2A TCK (a2aproject/a2a-tck, pinned in tck-expected.json) against the
  # AGBoss conformance agent (packages/agboss/tests/a2a-tck/) on JSON-RPC — as published, then with
  # tck-defects.patch — each requirement that does not pass named there with why. Python in the
  # TCK's own venv (`uv sync --frozen`). Not in `make check` (a network clone, ~2 min).
  a2a-tck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: node scripts/a2a-tck.mjs --dir "$RUNNER_TEMP/a2a-tck"
      - name: Upload the TCK's reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-tck-reports
          path: |
            ${{ runner.temp }}/a2a-tck/official/
            ${{ runner.temp }}/a2a-tck/patched/
          if-no-files-found: ignore

  # Changelog fragments (#981): a PR adds changes/<issue>-<slug>.md; only a release PR (branch
  # release/<version>) edits CHANGELOG.md, where scripts/changelog-assemble.mjs folds the fragments in.
  changelog-fragments:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node scripts/changelog-assemble.mjs --check
      - name: CHANGELOG.md is edited only by a release PR
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$HEAD_REF" in release/*) echo "release PR: CHANGELOG.md may change"; exit 0 ;; esac
          if git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::Do not edit CHANGELOG.md in a PR: add a fragment changes/<issue>-<slug>.md instead (see changes/README.md). Only a release PR (branch release/<version>) edits it."
            exit 1
          fi

  packed-project:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:packed

  publish-badge:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: /tmp/badge
      - name: Publish coverage badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$(mktemp -d)"
          git init -q -b badges
          cp /tmp/badge/coverage.json .
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "coverage badge for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
