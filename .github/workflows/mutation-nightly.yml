name: Mutation (nightly, cold)

# #626: every shard of stryker.config.mjs from scratch (`--force`), every night and on
# demand — the PRs' runs are incremental (ci.yml), and an incremental run trusts the results it
# cached for code and tests it sees unchanged; this run trusts none.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          [
            fencing,
            fencing-effects,
            sqlite-stores,
            keys-and-calls,
            takeover,
            recovery,
            undo,
            unwind,
            money,
            spend,
            cancel,
            fenced-reach,
            pauses,
            pauses-sqlite,
            pause-notices,
            rate-limits,
            money-runtime,
            cancel-stores,
            mesh-charge,
            once-state,
            once-child,
            once-mesh,
            fence-checkpoint,
            fence-tree,
            fence-workers,
            fence-config,
            cancel-x-runs,
            cancel-x-pauses,
            ledger-run,
            ledger-memory,
            ledger-branch,
            ledger-a2a-client,
            ledger-retention,
            budget-loop,
            budget-flow,
            budget-reply,
            assembly-rules,
            a2a-tasks,
            a2a-server,
            a2a-client,
            a2a-direct,
            stream,
            store-bound,
            a2a-files,
            files-pii,
          ]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @agboss/core
      # a file the shard mutates that no test of the shard runs is NoCoverage at the end of the run: say so first
      - name: A test of the shard runs every file it mutates
        run: node scripts/check-mutation-reach.mjs --shard ${{ matrix.shard }} --workers 2
      - name: Mutation testing of the shard, cold (break below 100 % killed or justified)
        run: npm run test:mutation -w @agboss/core -- --force
      - name: Mutation testing of the CLI's stream path, cold
        if: matrix.shard == 'stream'
        run: npm run test:mutation -w @agboss/cli -- --force
      # #1367: a Timeout counts as killed, and a survivor whose run outlasts Stryker's limit reads as one:
      # timeoutMS is above each shard's whole run (stryker.config.mjs), so a Timeout left must be a proven hang;
      # one that is not listed is run again alone (agbossjs/mongodb#103: a loaded runner moves it between mutants)
      - name: No Timeout that is not a proven hang (#1367)
        run: node scripts/stryker-timeouts.mjs --rerun --rerun-dir packages/agboss packages/agboss/reports/mutation/${{ matrix.shard }}.json
      - name: No Timeout that is not a proven hang, the CLI's stream path (#1367)
        if: matrix.shard == 'stream'
        run: node scripts/stryker-timeouts.mjs --rerun --rerun-dir packages/agboss-cli packages/agboss-cli/reports/mutation/cli-stream.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: |
            packages/agboss/reports/mutation/
            packages/agboss-cli/reports/mutation/

  # Three red nights passed unseen (2026-11-25..27): the first red run opens an issue, every later one comments on it,
  # a green run closes it. The default token: `issues: write` here, nothing more.
  report:
    needs: mutation
    if: ${{ always() && needs.mutation.result != 'cancelled' && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.mutation.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: "Nightly mutation run is red"
    steps:
      - name: Open, update or close the issue
        run: |
          set -euo pipefail
          open="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "The nightly mutation run is green again: $RUN_URL"
              gh issue close "$open" --reason completed
            fi
            exit 0
          fi
          failed="$(gh run view "$GITHUB_RUN_ID" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"
          body="The cold nightly mutation run failed: $RUN_URL

          Shards that failed: ${failed:-none read (see the run)}

          Each log lists the Survived and NoCoverage mutants. Reproduce one shard: \`MUTATION_SHARD=<shard> npm run test:mutation -w @agboss/core -- --force\`. The nightly must be green on the release head (RELEASE_CHECKLIST.md)."
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still red: $body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
