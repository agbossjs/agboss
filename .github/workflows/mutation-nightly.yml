name: Mutation (nightly, cold)

# #626: every shard of stryker.config.mjs from scratch (`--force`), every night and on
# demand — the PRs' runs are incremental (ci.yml), and an incremental run trusts the results it
# cached for code and tests it sees unchanged; this run trusts none.
# On demand, from any branch, for the shards you name (up to 20 run at once on the Free plan):
#   gh workflow run mutation-nightly.yml --ref <branch> -f shards=fence-tree,mesh-charge     (or -f shards=all)
#   gh run list --workflow mutation-nightly.yml --branch <branch> -L 1     then: gh run view <id> --log
# The workflow file must exist on main (a workflow GitHub does not know on the default branch cannot be dispatched);
# the version that runs is the one on --ref, so a change of this file is tried from its own branch.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Shards to run: a comma list (fence-tree,mesh-charge) or all"
        default: all
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: node scripts/mutation-changed.mjs --shards "${SHARDS:-all}" --github-output

  mutation:
    needs: plan
    uses: ./.github/workflows/mutation-shards.yml
    with:
      shards: ${{ needs.plan.outputs.shards }}
      cold: true
      max-parallel: 20

  # Three red nights passed unseen (2026-11-25..27): the first red run opens an issue, every later one comments on it,
  # a green run closes it. The default token: `issues: write` here, nothing more.
  report:
    needs: mutation
    if: ${{ always() && needs.mutation.result != 'cancelled' && needs.mutation.result != 'skipped' && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.mutation.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: "Nightly mutation run is red"
    steps:
      - name: Open, update or close the issue
        run: |
          set -euo pipefail
          open="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "The nightly mutation run is green again: $RUN_URL"
              gh issue close "$open" --reason completed
            fi
            exit 0
          fi
          failed="$(gh run view "$GITHUB_RUN_ID" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"
          body="The cold nightly mutation run failed: $RUN_URL

          Shards that failed: ${failed:-none read (see the run)}

          Each log lists the Survived and NoCoverage mutants. Reproduce one shard: \`MUTATION_SHARD=<shard> npm run test:mutation -w @agboss/core -- --force\`. The nightly must be green on the release head (RELEASE_CHECKLIST.md)."
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still red: $body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
