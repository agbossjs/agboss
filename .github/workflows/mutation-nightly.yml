name: Mutation (nightly, cold)

# #626: every shard of stryker.config.mjs from scratch (`--force`), every night and on
# demand — the PRs' runs are incremental (ci.yml), and an incremental run trusts the results it
# cached for code and tests it sees unchanged; this run trusts none.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          [
            fencing,
            fencing-effects,
            sqlite-stores,
            keys-and-calls,
            takeover,
            recovery,
            undo,
            unwind,
            money,
            spend,
            cancel,
            fenced-reach,
            pauses,
            pauses-sqlite,
            pause-notices,
            rate-limits,
            money-runtime,
            cancel-stores,
            mesh-charge,
            once-state,
            once-child,
            once-mesh,
            fence-checkpoint,
            fence-tree,
            fence-workers,
            fence-config,
            cancel-x-runs,
            cancel-x-pauses,
            ledger-run,
            ledger-memory,
            ledger-branch,
            ledger-a2a-client,
            ledger-retention,
            a2a-tasks,
            a2a-server,
            a2a-client,
            a2a-direct,
            stream,
            store-bound,
            a2a-files,
            files-pii,
          ]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @agboss/core
      - name: Mutation testing of the shard, cold (break below 100 % killed or justified)
        run: npm run test:mutation -w @agboss/core -- --force
      - name: Mutation testing of the CLI's stream path, cold
        if: matrix.shard == 'stream'
        run: npm run test:mutation -w @agboss/cli -- --force
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: |
            packages/agboss/reports/mutation/
            packages/agboss-cli/reports/mutation/
