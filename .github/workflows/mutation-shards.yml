name: Mutation shards (reusable)

# One Stryker job per shard, called by ci.yml (the shards a pull request touches, incremental) and by
# mutation-nightly.yml (every shard every night, or the shards a dispatch names, cold). #626, #1356.
# Every shard job writes its result as a job summary (survived / no-coverage file:line list) and uploads its JSON report;
# the `summary` job at the end puts all shards in one table. scripts/mutation-summary.mjs reads the reports.
on:
  workflow_call:
    inputs:
      shards:
        description: 'JSON list of shard names, e.g. ["fence-tree","mesh-charge"]'
        type: string
        required: true
      cold:
        description: "Run from scratch (--force) instead of from the cached last run"
        type: boolean
        default: false
      max-parallel:
        description: "How many shard jobs run at once (the Free plan allows 20 jobs at once across the repository)"
        type: number
        default: 10

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    # a cold run of a shard (no cached results) takes up to about 50 min here; an incremental one a few
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @agboss/core
      # a file the shard mutates that no test of the shard runs is NoCoverage at the end of a run of up to 50 min
      - name: A test of the shard runs every file it mutates
        run: node scripts/check-mutation-reach.mjs --shard ${{ matrix.shard }} --workers 2
      - name: Restore the shard's last mutation run
        if: ${{ !inputs.cold }}
        uses: actions/cache@v4
        with:
          path: |
            packages/agboss/reports/stryker-incremental-${{ matrix.shard }}.json
            packages/agboss-cli/reports/stryker-incremental-cli-stream.json
          # #1367: the limits and the vitest configs are in the key: an incremental run keeps the Timeouts a run
          # under other limits made (a survivor read as one), so a change of them runs every shard cold
          key: stryker-${{ matrix.shard }}-${{ hashFiles('packages/agboss/stryker.config.mjs', 'scripts/stryker-timeouts-ms.mjs', 'packages/agboss/vitest.mutation*.config.ts') }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.shard }}-${{ hashFiles('packages/agboss/stryker.config.mjs', 'scripts/stryker-timeouts-ms.mjs', 'packages/agboss/vitest.mutation*.config.ts') }}-
      - name: Mutation testing of the shard (break below 100 % killed or justified)
        env:
          FORCE: ${{ inputs.cold && '--force' || '' }}
        run: npm run test:mutation -w @agboss/core -- $FORCE
      # #1048: `agboss run`'s stream path (the CLI's own stryker config), beside the stream shard
      - name: Mutation testing of the CLI's stream path
        if: matrix.shard == 'stream'
        env:
          FORCE: ${{ inputs.cold && '--force' || '' }}
        run: npm run test:mutation -w @agboss/cli -- $FORCE
      # the result as the job's summary and in the log: the survivors and the lines no test runs, file:line
      - name: The shard's result (job summary)
        if: always()
        run: node scripts/mutation-summary.mjs --shard ${{ matrix.shard }} --summary packages/agboss/reports/mutation/${{ matrix.shard }}.json
      # #1367: a Timeout counts as killed, and a survivor whose run outlasts Stryker's limit reads as one:
      # timeoutMS is above each shard's whole run (stryker.config.mjs), so a Timeout left must be a proven hang;
      # one that is not listed is run again alone (agbossjs/mongodb#103: a loaded runner moves it between mutants)
      - name: No Timeout that is not a proven hang (#1367)
        run: node scripts/stryker-timeouts.mjs --rerun --rerun-dir packages/agboss packages/agboss/reports/mutation/${{ matrix.shard }}.json
      - name: No Timeout that is not a proven hang, the CLI's stream path (#1367)
        if: matrix.shard == 'stream'
        run: node scripts/stryker-timeouts.mjs --rerun --rerun-dir packages/agboss-cli packages/agboss-cli/reports/mutation/cli-stream.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: |
            packages/agboss/reports/mutation/
            packages/agboss-cli/reports/mutation/

  # every shard in one table, in the log and as the run's summary: read with `gh run view <id> --log` (this job) or
  # download the reports: `gh run download <id> -p 'mutation-report-*'`
  summary:
    needs: mutation
    if: ${{ always() && needs.mutation.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-report-*
          path: mutation-reports
      - run: node scripts/mutation-summary.mjs --table --summary mutation-reports
