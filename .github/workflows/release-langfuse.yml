name: Release @agboss/langfuse

# #1324f — @agboss/langfuse to npm, a car of the train after the core and the CLI (release.yml).
#
# A pushed tag `langfuse-vX.Y.Z` publishes `@agboss/langfuse@X.Y.Z` with provenance, only when:
#   - the tag is the package's version, and the commit is on `main`;
#   - the package's peer `@agboss/core` takes a core that is on npm at that version;
#   - the full CI (`ci.yml`) passed on a push of this exact commit (`scripts/release/ci-gate.mjs`).
# A version already on npm from this commit is left as it is (a re-run); from another commit, the
# run fails. Pull requests that touch the release path, and a manual dispatch, run the dry run:
# `npm publish --dry-run`, never a publish. The maintainer pushes the tag (RELEASE_CHECKLIST.md);
# the secret `NPM_TOKEN` lives in the `npm` environment.

on:
  push:
    tags: ["langfuse-v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-langfuse.yml
      - packages/agboss-langfuse/package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-langfuse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: dry run (npm publish --dry-run)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      # npm refuses a dry run over a published version: it is dry-run as X.Y.Z-dry-run.<run id>, on
      # this runner only
      - name: A version already on npm takes a dry-run suffix
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          version="$(node -p "require('./packages/agboss-langfuse/package.json').version")"
          if npm view "@agboss/langfuse@$version" version > /dev/null 2>&1; then
            npm pkg set "version=$version-dry-run.$RUN_ID" -w @agboss/langfuse
            echo "@agboss/langfuse@$version is on npm: dry-run as $version-dry-run.$RUN_ID"
          fi
      - name: npm publish --dry-run
        run: npm publish --dry-run --access public --tag dry-run -w @agboss/langfuse

  publish:
    name: publish @agboss/langfuse
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/langfuse-v')
    runs-on: ubuntu-24.04
    # ci-gate waits for main's CI on this commit (a cold mutation shard takes up to 90 min)
    timeout-minutes: 180
    environment: npm
    permissions:
      contents: read
      actions: read # the CI runs of this commit
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: The tag and the version
        run: |
          version="$(node -p "require('./packages/agboss-langfuse/package.json').version")"
          test "$GITHUB_REF_NAME" = "langfuse-v$version" || {
            echo "::error::the tag $GITHUB_REF_NAME is not langfuse-v$version, the package's version"
            exit 1
          }

      - name: The core it is peer of is on npm
        run: |
          version="$(node -p "require('./packages/agboss-langfuse/package.json').version")"
          test -n "$(npm view "@agboss/core@$version" version 2>/dev/null)" || {
            echo "::error::@agboss/core@$version is not on npm: publish the core first (release.yml)"
            exit 1
          }

      - name: The commit is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          }

      - name: CI passed on this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/ci-gate.mjs --sha "$GITHUB_SHA" --workflow ci.yml --timeout-minutes 150

      - name: Build
        run: npm run build

      - name: Publish @agboss/langfuse (skipped when this commit's version is on npm already)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::the npm environment has no NPM_TOKEN secret"; exit 1; }
          version="$(node -p "require('./packages/agboss-langfuse/package.json').version")"
          if [ -n "$(npm view "@agboss/langfuse@$version" version 2>/dev/null)" ]; then
            found="$(npm view "@agboss/langfuse@$version" gitHead 2>/dev/null || true)"
            if [ "$found" != "$GITHUB_SHA" ]; then
              echo "::error::@agboss/langfuse@$version is on npm from ${found:-an unknown commit}, not $GITHUB_SHA"
              exit 1
            fi
            echo "@agboss/langfuse@$version is on npm from $GITHUB_SHA already: nothing to publish"
          else
            npm publish --provenance --access public -w @agboss/langfuse
          fi
