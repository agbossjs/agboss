name: Sync Wiki

# The Wiki's pages are written in PRs and parked in the `docs/wiki-pending` branch of this
# repository (#341); this publishes that branch to the Wiki's `master` once `main`'s CI — which
# checks `docs/wiki-pending` against the code — has passed. (A `push` trigger on that branch never
# fires: GitHub reads the workflow from the pushed branch, and the Wiki branch has no `.github/`.)
# Fast-forward only: a page edited in the Wiki's web UI and missing from the branch stops the sync
# instead of being lost.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/wiki-pending
          fetch-depth: 0
      - name: Push docs/wiki-pending to the Wiki's master
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          wiki="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          git push "$wiki" HEAD:master
