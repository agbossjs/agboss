name: Sync Wiki

# The Wiki's pages are written in PRs and parked in the `docs/wiki-pending` branch of this
# repository (#341); this publishes that branch to the Wiki's `master` once `main`'s CI — which
# checks `docs/wiki-pending` against the code — has passed. (A `push` trigger on that branch never
# fires: GitHub reads the workflow from the pushed branch, and the Wiki branch has no `.github/`.)
# Fast-forward only: a page edited in the Wiki's web UI and missing from the branch stops the sync
# instead of being lost.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/wiki-pending
          fetch-depth: 0
      - name: Push docs/wiki-pending to the Wiki's master
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          wiki="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          # A push the Wiki refuses because it moved in between (`scripts/wiki.sh publish`, a UI edit, an
          # earlier run) is looked at again: fetch, decide, push; at most 5 attempts (#981).
          for attempt in 1 2 3 4 5; do
            git fetch -q "$wiki" master:refs/remotes/wiki/master
            # `scripts/wiki.sh publish` pushes the Wiki directly and fast-forwards this branch too, so
            # the Wiki usually holds the branch already: nothing to publish is a success.
            if git merge-base --is-ancestor HEAD refs/remotes/wiki/master; then
              echo "The Wiki already contains docs/wiki-pending ($(git rev-parse --short HEAD)); nothing to publish."
              exit 0
            fi
            if ! git merge-base --is-ancestor refs/remotes/wiki/master HEAD; then
              echo "::error::The Wiki's master and docs/wiki-pending diverged; merge the Wiki's commits into docs/wiki-pending (never force):"
              git log --oneline HEAD..refs/remotes/wiki/master
              exit 1
            fi
            if git push "$wiki" HEAD:master; then exit 0; fi
            echo "Push rejected (attempt $attempt of 5): the Wiki moved; looking again."
            sleep "$((attempt * 5))"
          done
          echo "::error::The Wiki's master kept moving: gave up after 5 attempts."
          exit 1
