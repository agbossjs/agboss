name: Sync Wiki

# The Wiki's pages are written in PRs, in their `wiki/` folder (#1026), checked there against the
# shared Wiki (`docs/wiki-pending`) plus the PR's own pages, and published here once the PR is on
# `main` and `main`'s CI has passed: `scripts/wiki-sync.sh` writes each merged PR's pages to the
# Wiki's `master` (exactly once: a `Wiki-Overlay-Source` trailer on the Wiki commit marks how far it
# got) and fast-forwards `docs/wiki-pending` to the same commit, so that branch only ever holds
# pages for code on main. (A `push` trigger on that branch never fires: GitHub reads the workflow
# from the pushed branch, and the Wiki branch has no `.github/`.)
# Fast-forward only: a page edited in the Wiki's web UI and missing from the branch stops the sync
# instead of being lost.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
      - name: Publish the merged Wiki pages
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
          UPTO: ${{ github.event.workflow_run.head_sha || 'HEAD' }}
        run: |
          export WIKI_URL="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          export REPO_URL="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          scripts/wiki-sync.sh
